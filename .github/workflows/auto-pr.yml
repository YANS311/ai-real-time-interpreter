# 推送 feature/* 分支时，自动创建或更新 Pull Request
# 使用仓库内置 GITHUB_TOKEN，无需额外配置

name: Auto Pull Request

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          BASE="main"
          TITLE=$(git log -1 --pretty=%s)
          COMMITS=$(git log "origin/${BASE}..HEAD" --pretty=format:"- %s" 2>/dev/null | head -8 || echo "- ${TITLE}")
          BODY="## Summary

          ${COMMITS}

          ## Test plan

          - [ ] python manage.py check
          - [ ] ./scripts/selftest.sh"

          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated PR #$EXISTING"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Created new PR"
          fi
