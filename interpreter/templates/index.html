<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI 同声传译助手</title>
  <style>
    :root {
      --bg: #0a0e14;
      --card: #151b26;
      --card2: #1c2433;
      --accent: #3b82f6;
      --accent2: #10b981;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --correct: #f59e0b;
      --border: #2d3a4f;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #121a28 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.15rem; font-weight: 600; }
    header p { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.75rem;
    }
    .metric-pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
      color: var(--muted);
    }
    .metric-pill strong { color: var(--accent2); font-weight: 600; }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    button, .file-label, select {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .file-label {
      background: var(--card);
      border: 1px dashed var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
    }
    .file-label input { display: none; }
    .lang-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-bar {
      background: var(--card);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.live { background: var(--accent2); animation: pulse 1.2s infinite; }
    .dot.warn { background: var(--correct); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .subtitle-panel {
      background: linear-gradient(180deg, var(--card) 0%, #111820 100%);
      border-radius: 12px;
      border: 1px solid var(--border);
      height: min(55vh, 480px);
      min-height: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .subtitle-header {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .input-tabs {
      display: flex; gap: 0.5rem; margin-bottom: 0.85rem;
    }
    .tab-btn {
      flex: 1; padding: 0.65rem; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-weight: 500;
    }
    .tab-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .input-panel { display: none; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
    .input-panel.active { display: flex; }
    .video-preview-wrap {
      width: 100%; background: #000; border-radius: 10px;
      border: 1px solid var(--border); overflow: hidden; max-height: 220px;
    }
    .video-preview-wrap video { width: 100%; max-height: 220px; display: block; }
    .progress-wrap {
      width: 100%; height: 6px; background: var(--card2);
      border-radius: 99px; overflow: hidden; display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.15s ease;
    }
    .subtitle-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1rem;
      scroll-behavior: smooth;
      text-align: center;
    }
    .subtitle-item {
      margin: 0 auto 0.85rem;
      max-width: 92%;
      padding: 0.85rem 1.1rem;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
      border-left: 3px solid var(--accent);
    }
    .subtitle-item.partial { opacity: 0.72; border-left-color: var(--muted); }
    .subtitle-item.corrected {
      border-left-color: var(--correct);
      background: rgba(245, 158, 11, 0.08);
    }
    .subtitle-item .source { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
    .subtitle-item .target { font-size: 1.15rem; font-weight: 600; color: #f0f6ff; }
    .subtitle-item.bilingual .target { font-size: 1.25rem; font-weight: 700; }
    .subtitle-item.bilingual .source {
      margin-top: 0.4rem; padding-top: 0.4rem;
      border-top: 1px dashed var(--border);
      font-style: italic;
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.12rem 0.38rem;
      border-radius: 4px;
      background: var(--correct);
      color: #111;
      margin-left: 0.4rem;
    }
    .options {
      margin-top: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .options label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
    .qiniu-link { font-size: 0.75rem; color: var(--accent); word-break: break-all; margin-top: 0.5rem; }
    .history-drawer {
      position: fixed; right: 0; top: 0; width: min(360px, 92vw); height: 100vh;
      background: var(--card); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.25s ease;
      z-index: 100; display: flex; flex-direction: column;
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
    }
    .history-drawer.open { transform: translateX(0); }
    .history-header {
      padding: 1rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-list { flex: 1; overflow-y: auto; padding: 0.75rem; }
    .history-item {
      padding: 0.75rem; border-radius: 8px; background: var(--card2);
      border: 1px solid var(--border); margin-bottom: 0.6rem; cursor: pointer;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-item .title { font-size: 0.9rem; font-weight: 600; }
    .history-item .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .history-actions { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--border); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
    .overlay.show { display: block; }
    .present-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.75); align-items: flex-end; justify-content: center;
      padding: 8vh 5vw 10vh; pointer-events: none;
    }
    .present-overlay.show { display: flex; }
    .present-text {
      max-width: 92vw; text-align: center; color: #fff;
      font-size: clamp(1.4rem, 4.5vw, 2.4rem); font-weight: 700;
      line-height: 1.45; text-shadow: 0 2px 16px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.45); padding: 1rem 1.5rem; border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .present-sub { display: block; margin-top: 0.6rem; font-size: 0.55em; font-weight: 400; color: #cbd5e1; }
    .glossary-box {
      width: 100%; min-height: 64px; margin-top: 0.5rem;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.6rem; font-size: 0.82rem; resize: vertical;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1rem; }
      .controls button, .controls .file-label, .lang-select { width: 100%; justify-content: center; }
      .subtitle-panel { height: 50vh; }
      .metric-pill { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI 同声传译助手</h1>
      <p>Whisper 流式 ASR · 大模型翻译纠错 · Edge-TTS · 七牛云存储</p>
    </div>
    <div class="metrics">
      <span class="metric-pill">延迟 <strong id="latencyMs">--</strong> ms</span>
      <span class="metric-pill">质量 <strong id="qualityScore">--</strong></span>
      <span class="metric-pill">信噪比 <strong id="snrDb">--</strong> dB</span>
      <span class="metric-pill">均延迟 <strong id="avgLatency">--</strong> ms</span>
      <span class="metric-pill">分片 <strong id="chunkMs">300</strong> ms</span>
      <span class="metric-pill" id="bgmPill">BGM <strong id="bgmStatus">--</strong></span>
      <span class="metric-pill" id="qiniuPill">七牛 <strong>--</strong></span>
    </div>
  </header>

  <main>
    <div class="input-tabs">
      <button type="button" class="tab-btn active" data-tab="mic">🎤 麦克风收音</button>
      <button type="button" class="tab-btn" data-tab="video">🎬 本地视频</button>
    </div>

    <div id="panelMic" class="input-panel active controls">
      <button id="btnMic" class="btn-primary">开始麦克风同传</button>
      <button id="btnStop" class="btn-danger" disabled>停止</button>
    </div>

    <div id="panelVideo" class="input-panel controls">
      <label class="file-label btn-primary" style="border:none;background:var(--accent);color:#fff">
        选择视频 MP4/MOV/AVI
        <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/x-msvideo,video/*,audio/*" />
      </label>
      <button id="btnVideoStart" class="btn-primary" disabled>开始视频同传</button>
      <button id="btnVideoStop" class="btn-danger" disabled>停止</button>
      <div class="video-preview-wrap" id="videoPreviewWrap" hidden>
        <video id="videoPreview" controls playsinline></video>
      </div>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="controls" style="margin-top:0">
      <select id="sourceLang" class="lang-select" title="源语言">
        <option value="auto">源语言：自动</option>
        <option value="en">英语 → 中文</option>
        <option value="ja">日语 → 中文</option>
        <option value="ko">韩语 → 中文</option>
      </select>
      <button id="btnClear" class="btn-secondary">清空字幕</button>
      <button id="btnExportSrt" class="btn-secondary">导出 SRT</button>
      <button id="btnHistory" class="btn-secondary">历史记录</button>
      <button id="btnCopyAll" class="btn-secondary">复制全文</button>
      <button id="btnExportBundle" class="btn-secondary">导出 ZIP</button>
      <button id="btnDemo" class="btn-secondary">一键演示</button>
      <button id="btnPresent" class="btn-secondary">演讲模式</button>
    </div>

    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <div id="qiniuLink" class="qiniu-link" hidden></div>

    <div class="subtitle-panel">
      <div class="subtitle-header">
        <span>实时字幕（深色面板 · 自动滚动）</span>
        <span id="sessionLabel"></span>
      </div>
      <div class="subtitle-list" id="subtitleList"></div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="chkTts" checked /> 中文语音播报</label>
      <label><input type="checkbox" id="chkPartial" checked /> 显示临时字幕</label>
      <label><input type="checkbox" id="chkBgm" checked /> BGM 人声分离（Spleeter/快速）</label>
      <label><input type="checkbox" id="chkDenoise" checked /> 环境降噪（风声/杂音）</label>
      <label><input type="checkbox" id="chkBilingual" checked /> 双语字幕（中文在上·原文在下）</label>
      <label>
        模式
        <select id="modeSelect" class="lang-select">
          <option value="low">低延迟（直播/麦克风 300ms）</option>
          <option value="high">高准确率（视频文件 800ms）</option>
        </select>
      </label>
    </div>
    <div class="options" style="margin-top:0.5rem; flex-direction:column; align-items:stretch">
      <label>术语表 / 热词 <span style="color:var(--muted)">（格式：GPT=生成式预训练模型,API=接口）</span></label>
      <textarea id="glossaryInput" class="glossary-box" placeholder="Whisper=语音识别,LLM=大语言模型"></textarea>
    </div>
  </main>

  <div class="present-overlay" id="presentOverlay">
    <div class="present-text">
      <span id="presentTarget">演讲模式 · 等待字幕</span>
      <span class="present-sub" id="presentSource"></span>
    </div>
  </div>

  <div class="overlay" id="historyOverlay"></div>
  <aside class="history-drawer" id="historyDrawer">
    <div class="history-header">
      <strong>同传历史记录</strong>
      <button id="btnCloseHistory" class="btn-secondary">关闭</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="history-actions">
      <button id="btnSaveHistory" class="btn-primary" style="flex:1">保存当前会话</button>
    </div>
  </aside>

  <script>
    const API_CHUNK = "/api/audio/chunk/";
    const API_UPLOAD = "/api/upload/";
    const API_VIDEO_INGEST = "/api/video/ingest/";
    const API_EXPORT = "/api/export/subtitles/";
    const API_RESET = "/api/session/reset/";
    const API_TTS = "/api/tts/";
    const API_HISTORY = "/api/history/";
    const API_HISTORY_SAVE = "/api/history/save/";
    const API_DEMO = "/api/demo/script/";
    const API_EXPORT_BUNDLE = "/api/export/bundle/";
    const LS_HISTORY_KEY = "interpreter_local_history";
    const LS_GLOSSARY_KEY = "interpreter_glossary";
    let CHUNK_INTERVAL_MS = 300;
    let qualitySamples = [];
    let saveHistoryTimer = null;
    let demoRunning = false;
    let presentMode = false;

    let sessionId = localStorage.getItem("interpreter_session") || crypto.randomUUID();
    localStorage.setItem("interpreter_session", sessionId);

    const subtitles = [];
    let mediaRecorder = null;
    let micStream = null;
    let pendingRequests = 0;
    let selectedVideoFile = null;
    let inputMode = "mic";

    const el = {
      btnMic: document.getElementById("btnMic"),
      btnStop: document.getElementById("btnStop"),
      btnVideoStart: document.getElementById("btnVideoStart"),
      btnVideoStop: document.getElementById("btnVideoStop"),
      videoPreview: document.getElementById("videoPreview"),
      videoPreviewWrap: document.getElementById("videoPreviewWrap"),
      progressWrap: document.getElementById("progressWrap"),
      progressBar: document.getElementById("progressBar"),
      panelMic: document.getElementById("panelMic"),
      panelVideo: document.getElementById("panelVideo"),
      btnClear: document.getElementById("btnClear"),
      btnExportSrt: document.getElementById("btnExportSrt"),
      chkBgm: document.getElementById("chkBgm"),
      chkDenoise: document.getElementById("chkDenoise"),
      chkBilingual: document.getElementById("chkBilingual"),
      modeSelect: document.getElementById("modeSelect"),
      bgmStatus: document.getElementById("bgmStatus"),
      fileInput: document.getElementById("fileInput"),
      sourceLang: document.getElementById("sourceLang"),
      statusText: document.getElementById("statusText"),
      statusDot: document.getElementById("statusDot"),
      subtitleList: document.getElementById("subtitleList"),
      sessionLabel: document.getElementById("sessionLabel"),
      latencyMs: document.getElementById("latencyMs"),
      chunkMs: document.getElementById("chunkMs"),
      qiniuPill: document.getElementById("qiniuPill"),
      qiniuLink: document.getElementById("qiniuLink"),
      chkTts: document.getElementById("chkTts"),
      chkPartial: document.getElementById("chkPartial"),
      qualityScore: document.getElementById("qualityScore"),
      snrDb: document.getElementById("snrDb"),
      avgLatency: document.getElementById("avgLatency"),
      btnHistory: document.getElementById("btnHistory"),
      btnCopyAll: document.getElementById("btnCopyAll"),
      btnSaveHistory: document.getElementById("btnSaveHistory"),
      btnCloseHistory: document.getElementById("btnCloseHistory"),
      historyDrawer: document.getElementById("historyDrawer"),
      historyOverlay: document.getElementById("historyOverlay"),
      historyList: document.getElementById("historyList"),
      btnDemo: document.getElementById("btnDemo"),
      btnPresent: document.getElementById("btnPresent"),
      btnExportBundle: document.getElementById("btnExportBundle"),
      glossaryInput: document.getElementById("glossaryInput"),
      presentOverlay: document.getElementById("presentOverlay"),
      presentTarget: document.getElementById("presentTarget"),
      presentSource: document.getElementById("presentSource"),
    };

    el.sessionLabel.textContent = "会话 " + sessionId.slice(0, 8);
    el.chunkMs.textContent = String(CHUNK_INTERVAL_MS);
    el.glossaryInput.value = localStorage.getItem(LS_GLOSSARY_KEY) || "";
    el.glossaryInput.addEventListener("input", () => {
      localStorage.setItem(LS_GLOSSARY_KEY, el.glossaryInput.value.trim());
    });

    function getGlossaryPayload() {
      const text = (el.glossaryInput.value || "").trim();
      return text || "";
    }

    function updatePresentOverlay() {
      if (!presentMode) return;
      const last = [...subtitles].reverse().find((s) => !s.partial && (s.target || s.source));
      if (!last) return;
      el.presentTarget.textContent = last.target || last.source || "";
      el.presentSource.textContent = last.source && last.target ? last.source : "";
    }

    function setStatus(text, mode = "idle") {
      el.statusText.textContent = text;
      el.statusDot.className = "dot" + (mode === "live" ? " live" : mode === "warn" ? " warn" : mode === "error" ? " error" : "");
    }

    function updateLatency(ms) {
      if (typeof ms === "number" && ms >= 0) el.latencyMs.textContent = String(ms);
    }

    function updateQualityMetrics(quality) {
      if (!quality) return;
      if (quality.score != null) el.qualityScore.textContent = String(quality.score);
      if (quality.snr_db != null) el.snrDb.textContent = String(quality.snr_db);
      qualitySamples.push({ score: quality.score || 0, latency: quality.latency_ms || 0 });
      if (qualitySamples.length > 20) qualitySamples.shift();
      const avg = qualitySamples.reduce((s, q) => s + q.latency, 0) / qualitySamples.length;
      el.avgLatency.textContent = String(Math.round(avg));
    }

    function subtitlesToPlainText() {
      return subtitles.map((s) => (s.target || s.source || "").trim()).filter(Boolean).join("\n");
    }

    function saveLocalHistorySnapshot() {
      if (!subtitles.length) return;
      const records = JSON.parse(localStorage.getItem(LS_HISTORY_KEY) || "[]");
      const snap = {
        id: "local-" + Date.now(),
        title: "本地快照 " + new Date().toLocaleString(),
        created_at_iso: new Date().toLocaleString(),
        line_count: subtitles.length,
        items: subtitles.map((s) => ({ ...s })),
      };
      records.unshift(snap);
      localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(records.slice(0, 20)));
    }

    function scheduleAutoSave() {
      clearTimeout(saveHistoryTimer);
      saveHistoryTimer = setTimeout(() => {
        saveLocalHistorySnapshot();
      }, 2000);
    }

    async function saveHistoryToServer() {
      if (!subtitles.length) {
        setStatus("暂无字幕可保存", "warn");
        return;
      }
      const res = await fetch(API_HISTORY_SAVE, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Session-Id": sessionId },
        body: JSON.stringify({
          session_id: sessionId,
          items: subtitles,
          meta: { avg_quality: el.qualityScore.textContent },
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "save failed");
      setStatus("已保存到服务器: " + data.record.title);
      await loadHistoryList();
    }

    async function loadHistoryList() {
      let server = [];
      try {
        const res = await fetch(API_HISTORY);
        const data = await res.json();
        server = data.records || [];
      } catch (_) {}
      const local = JSON.parse(localStorage.getItem(LS_HISTORY_KEY) || "[]");
      const all = [...server, ...local];
      el.historyList.innerHTML = all.length ? "" : '<p style="color:var(--muted);padding:1rem">暂无记录</p>';
      all.forEach((rec) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML =
          `<div class="title">${escapeHtml(rec.title || "未命名")}</div>` +
          `<div class="meta">${escapeHtml(rec.created_at_iso || "")} · ${rec.line_count || 0} 行</div>`;
        div.addEventListener("click", () => loadHistoryRecord(rec));
        el.historyList.appendChild(div);
      });
    }

    async function loadHistoryRecord(rec) {
      let items = rec.items;
      if (!items && rec.id && !String(rec.id).startsWith("local-")) {
        const res = await fetch(API_HISTORY + rec.id + "/");
        const data = await res.json();
        items = data.items;
      }
      if (!items?.length) return;
      subtitles.length = 0;
      items.forEach((h) => subtitles.push({ ...h, partial: false }));
      renderSubtitles();
      closeHistoryDrawer();
      setStatus("已加载历史记录: " + (rec.title || ""));
    }

    function openHistoryDrawer() {
      el.historyDrawer.classList.add("open");
      el.historyOverlay.classList.add("show");
      loadHistoryList();
    }

    function closeHistoryDrawer() {
      el.historyDrawer.classList.remove("open");
      el.historyOverlay.classList.remove("show");
    }

    function scrollToBottom() {
      el.subtitleList.scrollTop = el.subtitleList.scrollHeight;
    }

    function renderSubtitles() {
      const showPartial = el.chkPartial.checked;
      el.subtitleList.innerHTML = "";
      subtitles.forEach((item, idx) => {
        if (!showPartial && item.partial) return;
        const div = document.createElement("div");
        const bilingual = el.chkBilingual?.checked;
        div.className = "subtitle-item" +
          (item.partial ? " partial" : "") +
          (item.corrected ? " corrected" : "") +
          (bilingual ? " bilingual" : "");
        const badge = item.corrected ? '<span class="badge">已纠错</span>' : "";
        if (bilingual) {
          div.innerHTML =
            `<div class="target">${escapeHtml(item.target || "")}${badge}</div>` +
            `<div class="source">${escapeHtml(item.source || "")}</div>`;
        } else {
          div.innerHTML =
            `<div class="source">${escapeHtml(item.source || "")}</div>` +
            `<div class="target">${escapeHtml(item.target || "")}${badge}</div>`;
        }
        el.subtitleList.appendChild(div);
      });
      scrollToBottom();
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function applyCorrections(corrections) {
      if (!corrections?.length) return;
      corrections.forEach((c) => {
        const i = c.index;
        if (i >= 0 && i < subtitles.length) {
          if (c.source) subtitles[i].source = c.source;
          if (c.target) subtitles[i].target = c.target;
          subtitles[i].corrected = true;
          subtitles[i].partial = false;
        }
      });
      renderSubtitles();
    }

    function addSubtitle(source, target, partial, meta = {}) {
      if (!target && !source) return;
      const last = subtitles[subtitles.length - 1];
      const row = {
        source, target, partial, corrected: false,
        start_sec: meta.start_sec, end_sec: meta.end_sec,
      };
      if (last?.partial) {
        Object.assign(last, row);
      } else {
        subtitles.push(row);
      }
      renderSubtitles();
      updatePresentOverlay();
    }

    function setBgmInfo(bgm) {
      if (!bgm) return;
      const label = bgm.separated ? "已分离" : (bgm.has_bgm ? "已检测" : "无");
      el.bgmStatus.textContent = label;
      if (bgm.message) setStatus(bgm.message, bgm.has_bgm ? "warn" : "live");
    }

    async function playTts(text) {
      if (!el.chkTts.checked || !text?.trim()) return;
      try {
        const res = await fetch(API_TTS, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Session-Id": sessionId },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => URL.revokeObjectURL(url);
        await audio.play();
      } catch (e) { console.warn("TTS failed", e); }
    }

    async function sendChunk(blob, format, flush = false) {
      const fd = new FormData();
      fd.append("audio", blob, "chunk." + format);
      fd.append("format", format);
      fd.append("session_id", sessionId);
      fd.append("source_lang", el.sourceLang.value);
      fd.append("separate_bgm", el.chkBgm.checked ? "1" : "0");
      fd.append("denoise", el.chkDenoise.checked ? "1" : "0");
      fd.append("separation_method", "auto");
      const gloss = getGlossaryPayload();
      if (gloss) fd.append("glossary", gloss);
      if (flush) fd.append("flush", "1");

      pendingRequests++;
      const t0 = performance.now();
      try {
        const res = await fetch(API_CHUNK, {
          method: "POST",
          headers: { "X-Session-Id": sessionId },
          body: fd,
        });
        const data = await res.json();
        if (data.session_id) {
          sessionId = data.session_id;
          localStorage.setItem("interpreter_session", sessionId);
          el.sessionLabel.textContent = "会话 " + sessionId.slice(0, 8);
        }
        if (data.latency_ms != null) updateLatency(data.latency_ms);
        else updateLatency(Math.round(performance.now() - t0));
        if (!res.ok) setStatus(data.error || "服务异常", "error");
        return data;
      } finally {
        pendingRequests--;
      }
    }

    async function uploadToQiniu(file) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("session_id", sessionId);
      const res = await fetch(API_UPLOAD, { method: "POST", headers: { "X-Session-Id": sessionId }, body: fd });
      return res.json();
    }

    function syncHistoryFromServer(history) {
      if (!history?.length) return;
      subtitles.length = 0;
      history.forEach((h) => {
        subtitles.push({
          source: h.source || "",
          target: h.target || "",
          partial: false,
          corrected: !!h.corrected,
          start_sec: h.start_sec,
          end_sec: h.end_sec,
        });
      });
      renderSubtitles();
    }

    function setProgress(pct) {
      el.progressWrap.classList.toggle("show", pct > 0 && pct < 100);
      el.progressBar.style.width = pct + "%";
      if (pct >= 100) setTimeout(() => el.progressWrap.classList.remove("show"), 600);
    }

    function uploadWithProgress(url, formData) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        xhr.setRequestHeader("X-Session-Id", sessionId);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) setProgress(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => {
          setProgress(100);
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300) resolve(data);
            else reject(new Error(data.error || "upload failed"));
          } catch (err) { reject(err); }
        };
        xhr.onerror = () => reject(new Error("network error"));
        xhr.send(formData);
      });
    }

    async function handleResponse(data) {
      if (data.bgm) setBgmInfo(data.bgm);
      if (data.quality) updateQualityMetrics(data.quality);
      if (data.corrections?.length) applyCorrections(data.corrections);
      if (data.history?.length) syncHistoryFromServer(data.history);
      if (data.subtitle) {
        const { source, target, is_partial, start_sec, end_sec } = data.subtitle;
        addSubtitle(source, target, is_partial, { start_sec, end_sec });
        if (target && !is_partial) await playTts(target);
        scheduleAutoSave();
      }
    }

    async function pullProcessed(flush = false) {
      const fd = new FormData();
      fd.append("pull_processed", "1");
      fd.append("session_id", sessionId);
      fd.append("source_lang", el.sourceLang.value);
      if (flush) fd.append("flush", "1");
      const t0 = performance.now();
      const res = await fetch(API_CHUNK, {
        method: "POST",
        headers: { "X-Session-Id": sessionId },
        body: fd,
      });
      const data = await res.json();
      if (data.latency_ms != null) updateLatency(data.latency_ms);
      else updateLatency(Math.round(performance.now() - t0));
      return data;
    }

    function isVideoFile(file) {
      return /\.(mp4|mkv|mov|avi|webm|flv|wmv|m4v)$/i.test(file.name);
    }

    async function ingestMediaFile(file) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("session_id", sessionId);
      fd.append("separate_bgm", el.chkBgm.checked ? "1" : "0");
      fd.append("denoise", el.chkDenoise.checked ? "1" : "0");
      fd.append("separation_method", "auto");
      const gloss = getGlossaryPayload();
      if (gloss) fd.append("glossary", gloss);
      setProgress(1);
      const data = await uploadWithProgress(API_VIDEO_INGEST, fd);
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem("interpreter_session", sessionId);
        el.sessionLabel.textContent = "会话 " + sessionId.slice(0, 8);
      }
      if (data.qiniu?.url) {
        el.qiniuLink.hidden = false;
        el.qiniuLink.innerHTML = '云端文件：<a href="' + data.qiniu.url + '" target="_blank" rel="noopener">' + data.qiniu.url + '</a>';
      }
      if (data.video) {
        setStatus(`音频已提取 · ${data.video.duration_sec}s · ${data.video.format.toUpperCase()}`, "live");
      }
      setBgmInfo(data.bgm);
      return data;
    }

    async function streamProcessedFile() {
      while (true) {
        const data = await pullProcessed(false);
        await handleResponse(data);
        if (data.file_eof) break;
        await new Promise((r) => setTimeout(r, 20));
      }
      const tail = await pullProcessed(true);
      await handleResponse(tail);
    }

    async function startMic() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus("无法访问麦克风: " + e.message, "error");
        return;
      }
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      mediaRecorder = new MediaRecorder(micStream, { mimeType: mime });
      mediaRecorder.ondataavailable = async (ev) => {
        if (!ev.data.size) return;
        try {
          await handleResponse(await sendChunk(ev.data, "webm"));
        } catch (e) { setStatus("传输失败: " + e.message, "error"); }
      };
      mediaRecorder.start(CHUNK_INTERVAL_MS);
      el.btnMic.disabled = true;
      el.btnStop.disabled = false;
      setStatus("麦克风同传中 · " + CHUNK_INTERVAL_MS + "ms 分片", "live");
    }

    async function stopMic() {
      if (mediaRecorder?.state !== "inactive") {
        mediaRecorder.stop();
        await new Promise((r) => (mediaRecorder.onstop = r));
        try { await handleResponse(await sendChunk(new Blob(), "webm", true)); } catch (_) {}
      }
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
      mediaRecorder = null;
      el.btnMic.disabled = false;
      el.btnStop.disabled = true;
      setStatus("已停止");
      scheduleAutoSave();
    }

    async function processVideoFile(file) {
      el.btnVideoStart.disabled = true;
      el.btnVideoStop.disabled = false;
      try {
        setStatus("上传并提取音轨: " + file.name, "live");
        await ingestMediaFile(file);
        setStatus("流式同传识别中…", "live");
        await streamProcessedFile();
        setStatus("视频同传完成" + (el.chkBgm.checked ? "（BGM已分离）" : ""));
        scheduleAutoSave();
      } catch (e) {
        setStatus("视频处理失败: " + e.message, "error");
      } finally {
        el.btnVideoStart.disabled = !selectedVideoFile;
        el.btnVideoStop.disabled = true;
      }
    }

    async function processFile(file) {
      if (inputMode === "video" || isVideoFile(file)) {
        return processVideoFile(file);
      }
      el.btnMic.disabled = true;
      const useServer = el.chkBgm.checked;

      try {
        if (useServer) {
          setStatus("服务端解析音轨 + BGM 人声分离: " + file.name, "live");
          await ingestMediaFile(file);
          setStatus("流式同传识别中…", "live");
          await streamProcessedFile();
          setStatus("文件同传完成" + (el.chkBgm.checked ? "（已抑制 BGM）" : ""));
        } else {
          setStatus("浏览器流式解析: " + file.name, "live");
          const up = await uploadToQiniu(file);
          if (up.qiniu?.url) {
            el.qiniuLink.hidden = false;
            el.qiniuLink.innerHTML = '云端文件：<a href="' + up.qiniu.url + '" target="_blank" rel="noopener">' + up.qiniu.url + '</a>';
          }
          const url = URL.createObjectURL(file);
          const audio = new Audio(url);
          await new Promise((res, rej) => { audio.onloadedmetadata = res; audio.onerror = rej; });
          const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
          const stream = audio.captureStream?.() || audio.mozCaptureStream?.();
          if (!stream) throw new Error("请使用 Chrome/Edge 进行文件同传");
          const rec = new MediaRecorder(stream, { mimeType: mime });
          rec.ondataavailable = async (ev) => {
            if (!ev.data.size) return;
            await handleResponse(await sendChunk(ev.data, "webm"));
          };
          rec.start(CHUNK_INTERVAL_MS);
          audio.play();
          await new Promise((res) => {
            audio.onended = async () => {
              rec.stop();
              await new Promise((r) => (rec.onstop = r));
              await handleResponse(await sendChunk(new Blob(), "webm", true));
              URL.revokeObjectURL(url);
              res();
            };
          });
          setStatus("文件同传完成");
        }
      } catch (e) {
        setStatus("文件处理失败: " + e.message, "error");
      } finally {
        el.btnMic.disabled = false;
      }
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        inputMode = btn.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        el.panelMic.classList.toggle("active", inputMode === "mic");
        el.panelVideo.classList.toggle("active", inputMode === "video");
        if (inputMode === "mic") stopMic();
      });
    });

    el.btnMic.addEventListener("click", startMic);
    el.btnStop.addEventListener("click", stopMic);
    el.btnVideoStart.addEventListener("click", () => {
      if (selectedVideoFile) processVideoFile(selectedVideoFile);
    });
    el.btnVideoStop.addEventListener("click", () => {
      el.btnVideoStart.disabled = !selectedVideoFile;
      el.btnVideoStop.disabled = true;
      setStatus("已停止");
    });
    el.fileInput.addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      selectedVideoFile = f;
      el.btnVideoStart.disabled = false;
      if (isVideoFile(f)) {
        const url = URL.createObjectURL(f);
        el.videoPreview.src = url;
        el.videoPreviewWrap.hidden = false;
      } else {
        el.videoPreviewWrap.hidden = true;
      }
      setStatus("已选择: " + f.name + "，点击「开始视频同传」");
      e.target.value = "";
    });
    el.btnClear.addEventListener("click", async () => {
      subtitles.length = 0;
      renderSubtitles();
      el.qiniuLink.hidden = true;
      await fetch(API_RESET, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Session-Id": sessionId },
        body: JSON.stringify({ session_id: sessionId }),
      });
      setStatus("字幕已清空");
    });
    el.chkPartial.addEventListener("change", renderSubtitles);
    el.chkBilingual.addEventListener("change", renderSubtitles);
    el.modeSelect.addEventListener("change", () => {
      CHUNK_INTERVAL_MS = el.modeSelect.value === "high" ? 800 : 300;
      el.chunkMs.textContent = String(CHUNK_INTERVAL_MS);
      setStatus("已切换为" + (CHUNK_INTERVAL_MS === 300 ? "低延迟" : "高准确率") + "模式");
    });
    async function runDemoMode() {
      if (demoRunning) return;
      demoRunning = true;
      el.btnDemo.disabled = true;
      subtitles.length = 0;
      renderSubtitles();
      setStatus("演示模式播放中…", "live");
      try {
        const res = await fetch(API_DEMO);
        const script = await res.json();
        for (const line of script.lines || []) {
          addSubtitle(line.source, line.target, false, {
            start_sec: line.start_sec,
            end_sec: line.end_sec,
          });
          if (line.corrected) {
            const i = subtitles.length - 1;
            if (i >= 0) subtitles[i].corrected = true;
            renderSubtitles();
          }
          if (el.chkTts.checked && line.target) await playTts(line.target);
          await new Promise((r) => setTimeout(r, line.delay_ms || 1200));
        }
        setStatus("演示完成 · " + (script.title || ""));
        scheduleAutoSave();
      } catch (e) {
        setStatus("演示失败: " + e.message, "error");
      } finally {
        demoRunning = false;
        el.btnDemo.disabled = false;
      }
    }

    el.btnDemo.addEventListener("click", runDemoMode);
    el.btnPresent.addEventListener("click", () => {
      presentMode = !presentMode;
      el.presentOverlay.classList.toggle("show", presentMode);
      el.btnPresent.textContent = presentMode ? "退出演讲" : "演讲模式";
      updatePresentOverlay();
      setStatus(presentMode ? "演讲模式已开启（全屏大字幕）" : "已退出演讲模式");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && presentMode) {
        presentMode = false;
        el.presentOverlay.classList.remove("show");
        el.btnPresent.textContent = "演讲模式";
      }
    });
    el.btnExportBundle.addEventListener("click", async () => {
      if (!subtitles.length) { setStatus("暂无字幕", "warn"); return; }
      const res = await fetch(API_EXPORT_BUNDLE, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Session-Id": sessionId,
        },
        body: JSON.stringify({ items: subtitles }),
      });
      if (!res.ok) { setStatus("导出失败", "error"); return; }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "subtitles_bundle.zip";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("已导出 ZIP（SRT+TXT+JSON）");
    });
    el.btnHistory.addEventListener("click", openHistoryDrawer);
    el.btnCloseHistory.addEventListener("click", closeHistoryDrawer);
    el.historyOverlay.addEventListener("click", closeHistoryDrawer);
    el.btnSaveHistory.addEventListener("click", () => saveHistoryToServer().catch((e) => setStatus(e.message, "error")));
    el.btnCopyAll.addEventListener("click", async () => {
      const text = subtitlesToPlainText();
      if (!text) { setStatus("暂无内容", "warn"); return; }
      await navigator.clipboard.writeText(text);
      setStatus("已复制全文到剪贴板");
    });
    el.btnExportSrt.addEventListener("click", async () => {
      if (!subtitles.length) {
        setStatus("暂无字幕可导出", "warn");
        return;
      }
      const res = await fetch(API_EXPORT + "?format=srt", {
        headers: { "X-Session-Id": sessionId },
      });
      if (!res.ok) {
        setStatus("导出失败", "error");
        return;
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "subtitles.srt";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("SRT 字幕已导出");
    });

    fetch("/api/health/").then((r) => r.json()).then((h) => {
      if (h.chunk_duration_ms) el.chunkMs.textContent = String(h.chunk_duration_ms);
      el.qiniuPill.querySelector("strong").textContent = h.qiniu_configured ? "已接入" : "未配置";
      const parts = [];
      if (h.llm_configured) parts.push("LLM 就绪");
      else parts.push("请配置 LLM_API_KEY");
      if (h.spleeter_available) parts.push("Spleeter 就绪");
      if (h.circuit?.asr?.open || h.circuit?.llm?.open) setStatus("服务熔断中，请稍后重试", "warn");
      else setStatus("服务就绪 · " + parts.join(" · "));
    }).catch(() => setStatus("无法连接后端，请运行 python manage.py runserver", "error"));
  </script>
</body>
