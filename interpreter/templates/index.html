<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI 同声传译助手</title>
  <style>
    :root {
      --bg: #0a0e14;
      --card: #151b26;
      --card2: #1c2433;
      --accent: #3b82f6;
      --accent2: #10b981;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --correct: #f59e0b;
      --border: #2d3a4f;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #121a28 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.15rem; font-weight: 600; }
    header p { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.75rem;
    }
    .metric-pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
      color: var(--muted);
    }
    .metric-pill strong { color: var(--accent2); font-weight: 600; }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    button, .file-label, select {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .file-label {
      background: var(--card);
      border: 1px dashed var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
    }
    .file-label input { display: none; }
    .lang-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-bar {
      background: var(--card);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.live { background: var(--accent2); animation: pulse 1.2s infinite; }
    .dot.warn { background: var(--correct); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .subtitle-panel {
      background: linear-gradient(180deg, var(--card) 0%, #111820 100%);
      border-radius: 12px;
      border: 1px solid var(--border);
      height: min(55vh, 480px);
      min-height: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .subtitle-header {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .subtitle-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1rem;
      scroll-behavior: smooth;
    }
    .subtitle-item {
      margin-bottom: 0.85rem;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--accent);
    }
    .subtitle-item.partial { opacity: 0.72; border-left-color: var(--muted); }
    .subtitle-item.corrected {
      border-left-color: var(--correct);
      background: rgba(245, 158, 11, 0.08);
    }
    .subtitle-item .source { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
    .subtitle-item .target { font-size: 1rem; font-weight: 500; color: #f0f6ff; }
    .subtitle-item.bilingual .target { font-size: 1.08rem; font-weight: 600; }
    .subtitle-item.bilingual .source {
      margin-top: 0.4rem; padding-top: 0.4rem;
      border-top: 1px dashed var(--border);
      font-style: italic;
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.12rem 0.38rem;
      border-radius: 4px;
      background: var(--correct);
      color: #111;
      margin-left: 0.4rem;
    }
    .options {
      margin-top: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .options label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
    .qiniu-link { font-size: 0.75rem; color: var(--accent); word-break: break-all; margin-top: 0.5rem; }
    @media (max-width: 600px) {
      header h1 { font-size: 1rem; }
      .controls button, .controls .file-label, .lang-select { width: 100%; justify-content: center; }
      .subtitle-panel { height: 50vh; }
      .metric-pill { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI 同声传译助手</h1>
      <p>Whisper 流式 ASR · 大模型翻译纠错 · Edge-TTS · 七牛云存储</p>
    </div>
    <div class="metrics">
      <span class="metric-pill">延迟 <strong id="latencyMs">--</strong> ms</span>
      <span class="metric-pill">分片 <strong id="chunkMs">300</strong> ms</span>
      <span class="metric-pill" id="bgmPill">BGM <strong id="bgmStatus">--</strong></span>
      <span class="metric-pill" id="qiniuPill">七牛 <strong>--</strong></span>
    </div>
  </header>

  <main>
    <div class="controls">
      <button id="btnMic" class="btn-primary">开始麦克风同传</button>
      <button id="btnStop" class="btn-danger" disabled>停止</button>
      <label class="file-label">
        上传音视频文件
        <input type="file" id="fileInput" accept="audio/*,video/*" />
      </label>
      <select id="sourceLang" class="lang-select" title="源语言">
        <option value="auto">源语言：自动</option>
        <option value="en">英语 → 中文</option>
        <option value="ja">日语 → 中文</option>
        <option value="ko">韩语 → 中文</option>
      </select>
      <button id="btnClear" class="btn-secondary">清空字幕</button>
      <button id="btnExportSrt" class="btn-secondary">导出 SRT</button>
    </div>

    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <div id="qiniuLink" class="qiniu-link" hidden></div>

    <div class="subtitle-panel">
      <div class="subtitle-header">
        <span>实时字幕（深色面板 · 自动滚动）</span>
        <span id="sessionLabel"></span>
      </div>
      <div class="subtitle-list" id="subtitleList"></div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="chkTts" checked /> 中文语音播报</label>
      <label><input type="checkbox" id="chkPartial" checked /> 显示临时字幕</label>
      <label><input type="checkbox" id="chkBgm" checked /> BGM 人声分离（Spleeter/快速）</label>
      <label><input type="checkbox" id="chkDenoise" checked /> 环境降噪（风声/杂音）</label>
      <label><input type="checkbox" id="chkBilingual" checked /> 双语字幕（中文在上·原文在下）</label>
      <label>
        模式
        <select id="modeSelect" class="lang-select">
          <option value="low">低延迟（直播/麦克风 300ms）</option>
          <option value="high">高准确率（视频文件 800ms）</option>
        </select>
      </label>
    </div>
  </main>

  <script>
    const API_CHUNK = "/api/audio/chunk/";
    const API_UPLOAD = "/api/upload/";
    const API_VIDEO_INGEST = "/api/video/ingest/";
    const API_EXPORT = "/api/export/subtitles/";
    const API_RESET = "/api/session/reset/";
    const API_TTS = "/api/tts/";
    let CHUNK_INTERVAL_MS = 300;

    let sessionId = localStorage.getItem("interpreter_session") || crypto.randomUUID();
    localStorage.setItem("interpreter_session", sessionId);

    const subtitles = [];
    let mediaRecorder = null;
    let micStream = null;
    let pendingRequests = 0;

    const el = {
      btnMic: document.getElementById("btnMic"),
      btnStop: document.getElementById("btnStop"),
      btnClear: document.getElementById("btnClear"),
      btnExportSrt: document.getElementById("btnExportSrt"),
      chkBgm: document.getElementById("chkBgm"),
      chkDenoise: document.getElementById("chkDenoise"),
      chkBilingual: document.getElementById("chkBilingual"),
      modeSelect: document.getElementById("modeSelect"),
      bgmStatus: document.getElementById("bgmStatus"),
      fileInput: document.getElementById("fileInput"),
      sourceLang: document.getElementById("sourceLang"),
      statusText: document.getElementById("statusText"),
      statusDot: document.getElementById("statusDot"),
      subtitleList: document.getElementById("subtitleList"),
      sessionLabel: document.getElementById("sessionLabel"),
      latencyMs: document.getElementById("latencyMs"),
      chunkMs: document.getElementById("chunkMs"),
      qiniuPill: document.getElementById("qiniuPill"),
      qiniuLink: document.getElementById("qiniuLink"),
      chkTts: document.getElementById("chkTts"),
      chkPartial: document.getElementById("chkPartial"),
    };

    el.sessionLabel.textContent = "会话 " + sessionId.slice(0, 8);
    el.chunkMs.textContent = String(CHUNK_INTERVAL_MS);

    function setStatus(text, mode = "idle") {
      el.statusText.textContent = text;
      el.statusDot.className = "dot" + (mode === "live" ? " live" : mode === "warn" ? " warn" : mode === "error" ? " error" : "");
    }

    function updateLatency(ms) {
      if (typeof ms === "number" && ms >= 0) el.latencyMs.textContent = String(ms);
    }

    function scrollToBottom() {
      el.subtitleList.scrollTop = el.subtitleList.scrollHeight;
    }

    function renderSubtitles() {
      const showPartial = el.chkPartial.checked;
      el.subtitleList.innerHTML = "";
      subtitles.forEach((item, idx) => {
        if (!showPartial && item.partial) return;
        const div = document.createElement("div");
        const bilingual = el.chkBilingual?.checked;
        div.className = "subtitle-item" +
          (item.partial ? " partial" : "") +
          (item.corrected ? " corrected" : "") +
          (bilingual ? " bilingual" : "");
        const badge = item.corrected ? '<span class="badge">已纠错</span>' : "";
        if (bilingual) {
          div.innerHTML =
            `<div class="target">${escapeHtml(item.target || "")}${badge}</div>` +
            `<div class="source">${escapeHtml(item.source || "")}</div>`;
        } else {
          div.innerHTML =
            `<div class="source">${escapeHtml(item.source || "")}</div>` +
            `<div class="target">${escapeHtml(item.target || "")}${badge}</div>`;
        }
        el.subtitleList.appendChild(div);
      });
      scrollToBottom();
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function applyCorrections(corrections) {
      if (!corrections?.length) return;
      corrections.forEach((c) => {
        const i = c.index;
        if (i >= 0 && i < subtitles.length) {
          if (c.source) subtitles[i].source = c.source;
          if (c.target) subtitles[i].target = c.target;
          subtitles[i].corrected = true;
          subtitles[i].partial = false;
        }
      });
      renderSubtitles();
    }

    function addSubtitle(source, target, partial, meta = {}) {
      if (!target && !source) return;
      const last = subtitles[subtitles.length - 1];
      const row = {
        source, target, partial, corrected: false,
        start_sec: meta.start_sec, end_sec: meta.end_sec,
      };
      if (last?.partial) {
        Object.assign(last, row);
      } else {
        subtitles.push(row);
      }
      renderSubtitles();
    }

    function setBgmInfo(bgm) {
      if (!bgm) return;
      const label = bgm.separated ? "已分离" : (bgm.has_bgm ? "已检测" : "无");
      el.bgmStatus.textContent = label;
      if (bgm.message) setStatus(bgm.message, bgm.has_bgm ? "warn" : "live");
    }

    async function playTts(text) {
      if (!el.chkTts.checked || !text?.trim()) return;
      try {
        const res = await fetch(API_TTS, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Session-Id": sessionId },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => URL.revokeObjectURL(url);
        await audio.play();
      } catch (e) { console.warn("TTS failed", e); }
    }

    async function sendChunk(blob, format, flush = false) {
      const fd = new FormData();
      fd.append("audio", blob, "chunk." + format);
      fd.append("format", format);
      fd.append("session_id", sessionId);
      fd.append("source_lang", el.sourceLang.value);
      fd.append("separate_bgm", el.chkBgm.checked ? "1" : "0");
      fd.append("denoise", el.chkDenoise.checked ? "1" : "0");
      fd.append("separation_method", "auto");
      if (flush) fd.append("flush", "1");

      pendingRequests++;
      const t0 = performance.now();
      try {
        const res = await fetch(API_CHUNK, {
          method: "POST",
          headers: { "X-Session-Id": sessionId },
          body: fd,
        });
        const data = await res.json();
        if (data.session_id) {
          sessionId = data.session_id;
          localStorage.setItem("interpreter_session", sessionId);
          el.sessionLabel.textContent = "会话 " + sessionId.slice(0, 8);
        }
        if (data.latency_ms != null) updateLatency(data.latency_ms);
        else updateLatency(Math.round(performance.now() - t0));
        if (!res.ok) setStatus(data.error || "服务异常", "error");
        return data;
      } finally {
        pendingRequests--;
      }
    }

    async function uploadToQiniu(file) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("session_id", sessionId);
      const res = await fetch(API_UPLOAD, { method: "POST", headers: { "X-Session-Id": sessionId }, body: fd });
      return res.json();
    }

    async function handleResponse(data) {
      if (data.bgm) setBgmInfo(data.bgm);
      if (data.corrections?.length) applyCorrections(data.corrections);
      if (data.subtitle) {
        const { source, target, is_partial, start_sec, end_sec } = data.subtitle;
        addSubtitle(source, target, is_partial, { start_sec, end_sec });
        if (target && !is_partial) await playTts(target);
      }
    }

    async function pullProcessed(flush = false) {
      const fd = new FormData();
      fd.append("pull_processed", "1");
      fd.append("session_id", sessionId);
      fd.append("source_lang", el.sourceLang.value);
      if (flush) fd.append("flush", "1");
      const t0 = performance.now();
      const res = await fetch(API_CHUNK, {
        method: "POST",
        headers: { "X-Session-Id": sessionId },
        body: fd,
      });
      const data = await res.json();
      if (data.latency_ms != null) updateLatency(data.latency_ms);
      else updateLatency(Math.round(performance.now() - t0));
      return data;
    }

    function isVideoFile(file) {
      return /\.(mp4|mkv|mov|avi|webm|flv|wmv|m4v)$/i.test(file.name);
    }

    async function ingestMediaFile(file) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("session_id", sessionId);
      fd.append("separate_bgm", el.chkBgm.checked ? "1" : "0");
      fd.append("denoise", el.chkDenoise.checked ? "1" : "0");
      fd.append("separation_method", "auto");
      const res = await fetch(API_VIDEO_INGEST, {
        method: "POST",
        headers: { "X-Session-Id": sessionId },
        body: fd,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "ingest failed");
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem("interpreter_session", sessionId);
      }
      if (data.qiniu?.url) {
        el.qiniuLink.hidden = false;
        el.qiniuLink.innerHTML = '云端文件：<a href="' + data.qiniu.url + '" target="_blank" rel="noopener">' + data.qiniu.url + '</a>';
      }
      setBgmInfo(data.bgm);
      return data;
    }

    async function streamProcessedFile() {
      while (true) {
        const data = await pullProcessed(false);
        await handleResponse(data);
        if (data.file_eof) break;
        await new Promise((r) => setTimeout(r, 20));
      }
      const tail = await pullProcessed(true);
      await handleResponse(tail);
    }

    async function startMic() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus("无法访问麦克风: " + e.message, "error");
        return;
      }
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      mediaRecorder = new MediaRecorder(micStream, { mimeType: mime });
      mediaRecorder.ondataavailable = async (ev) => {
        if (!ev.data.size) return;
        try {
          await handleResponse(await sendChunk(ev.data, "webm"));
        } catch (e) { setStatus("传输失败: " + e.message, "error"); }
      };
      mediaRecorder.start(CHUNK_INTERVAL_MS);
      el.btnMic.disabled = true;
      el.btnStop.disabled = false;
      setStatus("麦克风同传中 · " + CHUNK_INTERVAL_MS + "ms 分片", "live");
    }

    async function stopMic() {
      if (mediaRecorder?.state !== "inactive") {
        mediaRecorder.stop();
        await new Promise((r) => (mediaRecorder.onstop = r));
        try { await handleResponse(await sendChunk(new Blob(), "webm", true)); } catch (_) {}
      }
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
      mediaRecorder = null;
      el.btnMic.disabled = false;
      el.btnStop.disabled = true;
      setStatus("已停止");
    }

    async function processFile(file) {
      el.btnMic.disabled = true;
      const useServer = isVideoFile(file) || el.chkBgm.checked;

      try {
        if (useServer) {
          setStatus("服务端解析音轨 + BGM 人声分离: " + file.name, "live");
          await ingestMediaFile(file);
          setStatus("流式同传识别中…", "live");
          await streamProcessedFile();
          setStatus("文件同传完成" + (el.chkBgm.checked ? "（已抑制 BGM）" : ""));
        } else {
          setStatus("浏览器流式解析: " + file.name, "live");
          const up = await uploadToQiniu(file);
          if (up.qiniu?.url) {
            el.qiniuLink.hidden = false;
            el.qiniuLink.innerHTML = '云端文件：<a href="' + up.qiniu.url + '" target="_blank" rel="noopener">' + up.qiniu.url + '</a>';
          }
          const url = URL.createObjectURL(file);
          const audio = new Audio(url);
          await new Promise((res, rej) => { audio.onloadedmetadata = res; audio.onerror = rej; });
          const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
          const stream = audio.captureStream?.() || audio.mozCaptureStream?.();
          if (!stream) throw new Error("请使用 Chrome/Edge 进行文件同传");
          const rec = new MediaRecorder(stream, { mimeType: mime });
          rec.ondataavailable = async (ev) => {
            if (!ev.data.size) return;
            await handleResponse(await sendChunk(ev.data, "webm"));
          };
          rec.start(CHUNK_INTERVAL_MS);
          audio.play();
          await new Promise((res) => {
            audio.onended = async () => {
              rec.stop();
              await new Promise((r) => (rec.onstop = r));
              await handleResponse(await sendChunk(new Blob(), "webm", true));
              URL.revokeObjectURL(url);
              res();
            };
          });
          setStatus("文件同传完成");
        }
      } catch (e) {
        setStatus("文件处理失败: " + e.message, "error");
      } finally {
        el.btnMic.disabled = false;
      }
    }

    el.btnMic.addEventListener("click", startMic);
    el.btnStop.addEventListener("click", stopMic);
    el.fileInput.addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (f) processFile(f);
      e.target.value = "";
    });
    el.btnClear.addEventListener("click", async () => {
      subtitles.length = 0;
      renderSubtitles();
      el.qiniuLink.hidden = true;
      await fetch(API_RESET, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Session-Id": sessionId },
        body: JSON.stringify({ session_id: sessionId }),
      });
      setStatus("字幕已清空");
    });
    el.chkPartial.addEventListener("change", renderSubtitles);
    el.chkBilingual.addEventListener("change", renderSubtitles);
    el.modeSelect.addEventListener("change", () => {
      CHUNK_INTERVAL_MS = el.modeSelect.value === "high" ? 800 : 300;
      el.chunkMs.textContent = String(CHUNK_INTERVAL_MS);
      setStatus("已切换为" + (CHUNK_INTERVAL_MS === 300 ? "低延迟" : "高准确率") + "模式");
    });
    el.btnExportSrt.addEventListener("click", async () => {
      if (!subtitles.length) {
        setStatus("暂无字幕可导出", "warn");
        return;
      }
      const res = await fetch(API_EXPORT + "?format=srt", {
        headers: { "X-Session-Id": sessionId },
      });
      if (!res.ok) {
        setStatus("导出失败", "error");
        return;
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "subtitles.srt";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("SRT 字幕已导出");
    });

    fetch("/api/health/").then((r) => r.json()).then((h) => {
      if (h.chunk_duration_ms) el.chunkMs.textContent = String(h.chunk_duration_ms);
      el.qiniuPill.querySelector("strong").textContent = h.qiniu_configured ? "已接入" : "未配置";
      const parts = [];
      if (h.llm_configured) parts.push("LLM 就绪");
      else parts.push("请配置 LLM_API_KEY");
      if (h.spleeter_available) parts.push("Spleeter 就绪");
      if (h.circuit?.asr?.open || h.circuit?.llm?.open) setStatus("服务熔断中，请稍后重试", "warn");
      else setStatus("服务就绪 · " + parts.join(" · "));
    }).catch(() => setStatus("无法连接后端，请运行 python manage.py runserver", "error"));
  </script>
</body>
</html>
